name: lgtm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Run full LGTM policy check
        id: lgtm
        continue-on-error: true
        run: |
          set -o pipefail
          cargo run --locked -- check --tier full 2>&1 | tee lgtm-check.log
      - name: Annotate failed MUST results
        if: always()
        run: |
          if test -f .lgtm/evidence/evidence.jsonl; then
            tail -n 1 .lgtm/evidence/evidence.jsonl | jq -r '
              .results[] | select(.status == "failed" and .severity == "error") |
              if (.locations | length) > 0 then
                .locations[] | "::error file=\(.file),line=\(.line // 1),title=LGTM MUST \(.rule_id)::\(.message)"
              else
                "::error title=LGTM MUST \(.rule_id)::\(.message)"
              end' || true
          fi
      - name: Enforce unresolved MUST failures only
        if: always()
        run: |
          if test "${{ steps.lgtm.outcome }}" != success; then
            echo "LGTM check command failed before producing a policy decision"
            exit 1
          fi
          if ! test -s .lgtm/evidence/evidence.jsonl; then
            echo "LGTM policy evidence is missing"
            exit 1
          fi
          if ! tail -n 1 .lgtm/evidence/evidence.jsonl | jq -s -e '
            def valid_result:
              type == "object"
              and (.status | IN("passed", "failed", "warning", "skipped", "not_applicable", "unverified", "overridden", "waived"))
              and (.severity | IN("error", "warning", "info"));
            (if length != 1 then error("Expected exactly one evidence record") else .[0] end)
            | if type != "object" or (.results | type) != "array" then
              error("Invalid LGTM evidence")
            elif any(.results[]; valid_result | not) then
              error("Invalid LGTM enforcement result")
            else
              all(.results[]; .status != "failed" or .severity != "error")
            end' >/dev/null; then
            echo "LGTM evidence is invalid or contains unresolved error-severity MUST failures"
            exit 1
          fi
      - name: Upload bounded LGTM evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lgtm-check-output
          path: |
            lgtm-check.log
            .lgtm/evidence/evidence.jsonl
          retention-days: 14

  macos-tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Run macOS test suite
        run: cargo test --locked --all-targets --all-features
