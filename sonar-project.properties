sonar.projectKey=tcbuilds_lgtm
sonar.organization=tcbuilds


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=lgtm
#sonar.projectVersion=1.0


# Keep fixtures in test scope and generated build artifacts out of source scope.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,target/**
sonar.test.inclusions=tests/**/*.rs,tests/**/*.cjs,tests/**/*.js
sonar.javascript.lcov.reportPaths=target/jev-coverage/lcov.info

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
